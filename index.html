
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KinoBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #151515);
      color: var(--tg-theme-text-color, white);
      padding: 20px;
      text-align: center;
    }
    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      border: none;
      background: #2481cc;
      color: white;
      cursor: pointer;
    }
    input {
      border: 1px solid #888;
      background: var(--tg-theme-secondary-bg-color, #292929);
      color: var(--tg-theme-text-color, white);
    }
    #searchBox, #suggestBox { display: none; }
  </style>
</head>
<body>
  <h2>🎬 KinoBot</h2>
  <p>Kerakli bo‘limni tanlang</p>

  <button onclick="showBox('suggestBox')">💡 Taklif berish</button>
  <button onclick="showBox('searchBox')">🔎 Kino izlash</button>

  <div id="suggestBox">
    <h3>Qaysi kinoni ko‘rmoqchisiz?</h3>
    <input id="suggestion" placeholder="Kino nomini yozing">
    <button onclick="sendMovie('suggestion','suggest')">Taklifni yuborish</button>
  </div>

  <div id="searchBox">
    <h3>Qaysi kinoni izlayapsiz?</h3>
    <input id="movie" placeholder="Kino nomini yozing">
    <button onclick="sendMovie('movie','search')">Kino izlash</button>
  </div>

  <p id="result"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API = 'https://kino-bot-mlm9.onrender.com';

    function showBox(id) {
      document.getElementById('suggestBox').style.display = 'none';
      document.getElementById('searchBox').style.display = 'none';
      document.getElementById(id).style.display = 'block';
      document.getElementById('result').textContent = '';
    }

    async function sendMovie(inputId, action) {
      const field = document.getElementById(inputId);
      const name = field.value.trim();
      const result = document.getElementById('result');

      if (!name) {
        result.textContent = 'Iltimos, kino nomini yozing!';
        return;
      }

      result.textContent = 'Yuborilmoqda...';

      try {
        const response = await fetch(API + '/api/' + action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            movie: name,
            initData: tg.initData || ''
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Xatolik yuz berdi.');
        }

       if (action === 'search') {
  result.replaceChildren();

  if (data.results && data.results.length > 0) {
    data.results.forEach(movie => {
      const card = document.createElement('div');

      card.style.cssText = `
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 14px;
        padding: 15px;
        margin: 12px 0;
        text-align: center;
      `;

      const title = document.createElement('div');
      title.textContent = movie.title;
      title.style.cssText = `
        color: white;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 12px;
      `;

      const button = document.createElement('a');
      button.href = movie.url;
      button.target = '_blank';
      button.rel = 'noopener noreferrer';
      button.textContent = '🎬 TOMOSHA QILISH';
      button.style.cssText = `
        display: block;
        background: linear-gradient(135deg, #6c5ce7, #4834d4);
        color: white;
        padding: 13px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      `;

      card.appendChild(title);
      card.appendChild(button);
      result.appendChild(card);
    });
  } else {
    result.textContent = 'Kino topilmadi.';
  }
} else {
  result.textContent = data.message || 'So‘rov muvaffaqiyatli yuborildi!';
}
        field.value = '';
      } catch (error) {
        result.textContent = 'Server bilan bog‘lanib bo‘lmadi. Keyinroq urinib ko‘ring.';
      }
    }
  </script>
</body>
</html>
